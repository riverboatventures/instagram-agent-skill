<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="art" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0b3d"/><stop offset=".38" stop-color="#6a1b8a"/>
    <stop offset=".62" stop-color="#ff2e88"/><stop offset=".80" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff07a"/><stop offset=".5" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ff2e88"/>
  </linearGradient>
  <linearGradient id="six" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffe0f0"/><stop offset="1" stop-color="#ffd38a"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a0f55"/><stop offset="1" stop-color="#0c0524"/>
  </linearGradient>
  <mask id="sunStripes">
    <rect width="1080" height="1080" fill="#fff"/>
    <g fill="#000"><rect x="0" y="560" width="1080" height="8"/><rect x="0" y="600" width="1080" height="12"/>
    <rect x="0" y="642" width="1080" height="16"/><rect x="0" y="686" width="1080" height="20"/></g>
  </mask>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow"><feGaussianBlur stdDeviation="40"/></filter>
  <g id="frond"><path d="M0 0 C 60 -40 150 -40 230 10 C 150 -5 70 5 0 0 Z"/></g>
  <g id="palm">
    <path d="M0 0 C 10 -120 30 -260 70 -380 L 84 -376 C 46 -256 28 -118 22 0 Z"/>
    <g transform="translate(77,-380)">
      <use href="#frond" transform="rotate(-20)"/><use href="#frond" transform="rotate(20)"/>
      <use href="#frond" transform="rotate(60)"/><use href="#frond" transform="scale(-1,1) rotate(-20)"/>
      <use href="#frond" transform="scale(-1,1) rotate(20)"/><use href="#frond" transform="scale(-1,1) rotate(60)"/>
      <use href="#frond" transform="rotate(-60) scale(.8)"/><use href="#frond" transform="scale(-1,1) rotate(-60) scale(.8)"/>
    </g>
  </g>
</defs>
<rect width="1080" height="1080" fill="url(#sky)"/>
<g fill="#fff" opacity=".8"><circle cx="210" cy="170" r="3"/><circle cx="860" cy="140" r="2.5"/><circle cx="760" cy="250" r="2"/><circle cx="330" cy="290" r="2"/><circle cx="560" cy="110" r="2"/></g>
<circle cx="540" cy="560" r="330" fill="#ff5fa0" opacity=".45" filter="url(#softglow)"/>
<circle cx="540" cy="560" r="290" fill="url(#sun)" mask="url(#sunStripes)"/>
<rect x="0" y="760" width="1080" height="320" fill="url(#sea)"/>
<g stroke="#ff4fa3" stroke-opacity=".55" stroke-width="3">
  <line x1="0" y1="800" x2="1080" y2="800"/><line x1="0" y1="850" x2="1080" y2="850"/><line x1="0" y1="920" x2="1080" y2="920"/><line x1="0" y1="1010" x2="1080" y2="1010"/>
  <line x1="540" y1="760" x2="540" y2="1080"/><line x1="440" y1="760" x2="160" y2="1080"/><line x1="640" y1="760" x2="920" y2="1080"/>
  <line x1="340" y1="760" x2="-200" y2="1080"/><line x1="740" y1="760" x2="1280" y2="1080"/>
</g>
<rect x="0" y="756" width="1080" height="6" fill="#ffd38a" opacity=".9"/>
<g fill="#12051f">
  <use href="#palm" transform="translate(120,800) scale(1.15)"/>
  <use href="#palm" transform="translate(960,800) scale(-1.0,1.0)"/>
</g>
<g font-family="Anton, 'DejaVu Sans', sans-serif" font-size="760" text-anchor="middle">
  <text x="556" y="866" fill="#ff2e88" filter="url(#glow)" transform="skewX(-8)" opacity=".9">6</text>
  <text x="572" y="882" fill="#2a0a3d" transform="skewX(-8)">6</text>
  <text x="556" y="866" fill="url(#six)" stroke="#ff2e88" stroke-width="10" paint-order="stroke" transform="skewX(-8)">6</text>
</g>
</svg></body></html>
